id = "ore"
name = "Ore"
version = "0.5.0"
schema_version = 1
authors = ["Ilya Torshin <dev@xlsft.ru>"]
description = "Ore language support: highlighting and the Ore language server."
repository = "https://github.com/orelang/ore"

# Ore has exactly the TypeScript syntax, so the language uses Zed's built-in
# `typescript` grammar (see languages/ore/config.toml) and declares none.

[language_servers.ore]
name = "Ore Language Server"
languages = ["Ore"]
