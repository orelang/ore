name: Feature
description: A change to the language, the runtime or the tools
labels: [feature]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today? Show code if you can.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like, and how it fits TypeScript's syntax and Ore's semantics.
    validations:
      required: true
