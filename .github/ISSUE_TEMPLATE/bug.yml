name: Bug
description: Something does not work as the specification says
labels: [bug]
body:
  - type: textarea
    id: program
    attributes:
      label: Program
      description: The smallest program that shows the problem.
      render: ts
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What should happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What happens instead (output, errors, a panic's stack trace).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and platform
      description: The output of `ore version`, and your system (e.g. macOS 15 arm64).
    validations:
      required: true
