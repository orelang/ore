# A release of `ore` on a tag vX.Y.Z, whose commit sets that version in
# compiler/package.json. On Linux (amd64, arm64; built in Ubuntu 22.04, the
# oldest with OpenSSL 3 for ore:tls and LLVM for arm64 on apt.llvm.org, so
# that it runs where glibc is 2.35 or newer) and macOS (arm64): the
# compiler bootstraps from the previous release (from the seed, the last
# commit with the compiler in TypeScript, for the first one), checks that it
# reproduces itself, passes the test suite, and is packed with its LLVM and
# lld. The editor extensions, which carry the same version (ci/versions.sh),
# are packed: the VS Code .vsix and the Zed extension's zip. The archives, the
# extensions and SHA256SUMS make a GitHub Release, the Homebrew formula in
# orelang/homebrew-tap is updated, and the .vsix is published to the Visual
# Studio Marketplace and Open VSX (each only when its token, the secret
# VSCE_PAT or OVSX_PAT, is set). GitLab's pipeline for the same tag copies the
# files to its package registry and its release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: ubuntu-24.04, os: linux, arch: amd64, container: "ubuntu:22.04" }
          - { runner: ubuntu-24.04-arm, os: linux, arch: arm64, container: "ubuntu:22.04" }
          - { runner: macos-14, os: darwin, arch: arm64, container: "" }
    runs-on: ${{ matrix.runner }}
    # The oldest glibc the Linux build is made with is the oldest it runs
    # with: ore and the libraries packed with it need its version or newer.
    container: ${{ matrix.container }}
    steps:
      - name: Packages (Linux), git before the checkout so that it clones
        if: matrix.os == 'linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends wget gnupg lsb-release software-properties-common \
            ca-certificates git curl unzip patchelf xz-utils libc6-dev tzdata
          # The checkout belongs to another user than the container's root.
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: LLVM, lld and clang (Linux)
        if: matrix.os == 'linux'
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          bash llvm.sh 22
          apt-get install -y -qq --no-install-recommends llvm-22-dev lld-22 clang-22
          ln -sf /usr/bin/clang-22 /usr/local/bin/clang
          ln -sf /usr/bin/clang-22 /usr/local/bin/cc
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"

      - name: LLVM and lld (macOS)
        if: matrix.os == 'darwin'
        run: |
          brew install llvm lld openssl@3
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"

      - name: Stage 0, the previous release
        id: previous
        run: |
          if ORE_HOME="$RUNNER_TEMP/previous" sh install.sh; then
            echo "ore=$RUNNER_TEMP/previous/bin/ore" >> "$GITHUB_OUTPUT"
          fi

      - name: Bun, to build the seed (first release only)
        if: steps.previous.outputs.ore == ''
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Bootstrap
        env:
          ORE: ${{ steps.previous.outputs.ore }}
        run: |
          # The seed links without libdl, which glibc before 2.34 needs for
          # dladdr: with clang (stage 0) and with lld (stage 1). Later stages
          # link it themselves.
          if [ -z "$ORE" ] && [ "$(uname -s)" = Linux ]; then
            printf '#!/bin/sh\nexec ld.lld "$@" -ldl\n' > "$RUNNER_TEMP/ld-dl"
            chmod +x "$RUNNER_TEMP/ld-dl"
            export ORE_LD="$RUNNER_TEMP/ld-dl" CCC_OVERRIDE_OPTIONS=+-ldl
          fi
          ci/bootstrap.sh dist

      - name: The version is the tag's
        run: |
          test "v$(dist/ore version)" = "$GITHUB_REF_NAME"
          ci/versions.sh "$GITHUB_REF_NAME"

      - name: Tests
        run: ORE=dist/ore ci/test.sh

      - name: Pack
        run: ci/package.sh "$GITHUB_REF_NAME" dist/ore out

      - uses: actions/upload-artifact@v4
        with:
          name: ore-${{ matrix.os }}-${{ matrix.arch }}
          path: out/*.tar.gz

  extensions:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The extensions carry the tag's version
        run: ci/versions.sh "$GITHUB_REF_NAME"
      - name: Pack
        run: ci/extensions.sh "$GITHUB_REF_NAME" out
      - uses: actions/upload-artifact@v4
        with:
          name: ore-extensions
          path: |
            out/*.vsix
            out/*.zip

  release:
    needs: [build, extensions]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        working-directory: out
        run: sha256sum *.tar.gz *.vsix *.zip > SHA256SUMS && cat SHA256SUMS
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ci/notes.sh "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" out/*.tar.gz out/*.vsix out/*.zip out/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: sums
          path: out/SHA256SUMS

  homebrew:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sums
      - name: The formula, in orelang/homebrew-tap
        env:
          TAP_KEY: ${{ secrets.HOMEBREW_TAP_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_KEY" > ~/.ssh/tap
          chmod 600 ~/.ssh/tap
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap -o StrictHostKeyChecking=accept-new"
          git clone -q git@github.com:orelang/homebrew-tap.git tap
          mkdir -p tap/Formula
          ci/formula.sh "$GITHUB_REF_NAME" SHA256SUMS > tap/Formula/ore.rb
          cd tap
          git config user.name "ore release"
          git config user.email "release@orelang.invalid"
          git add Formula/ore.rb
          git commit -qm "ore ${GITHUB_REF_NAME#v}"
          git push -q origin HEAD

  # The .vsix of the release, to the Visual Studio Marketplace (publisher
  # orelang, token VSCE_PAT) and to Open VSX (namespace orelang, token
  # OVSX_PAT). Without its secret, a step is skipped with a notice.
  vscode:
    needs: release
    runs-on: ubuntu-24.04
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ore-extensions
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Visual Studio Marketplace
        if: env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce@3.2.1 publish --skip-duplicate --packagePath "ore-vscode-$GITHUB_REF_NAME.vsix"
      - name: Visual Studio Marketplace (no VSCE_PAT)
        if: env.VSCE_PAT == ''
        run: echo "::notice::VSCE_PAT is not set; the extension is not published to the Visual Studio Marketplace"
      - name: Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx@1.2.0 publish --skip-duplicate -p "$OVSX_PAT" "ore-vscode-$GITHUB_REF_NAME.vsix"
      - name: Open VSX (no OVSX_PAT)
        if: env.OVSX_PAT == ''
        run: echo "::notice::OVSX_PAT is not set; the extension is not published to Open VSX"
