# A release of `ore` on a tag vX.Y.Z, whose commit sets that version in
# compiler/package.json. On Linux (amd64, arm64) and macOS (arm64): the
# compiler bootstraps from the previous release (from the seed, the last
# commit with the compiler in TypeScript, for the first one), checks that it
# reproduces itself, passes the test suite, and is packed with its LLVM and
# lld. The archives and SHA256SUMS make a GitHub Release, and the Homebrew
# formula in orelang/homebrew-tap is updated. GitLab's pipeline for the same
# tag copies the files to its package registry and its release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: ubuntu-24.04, os: linux, arch: amd64 }
          - { runner: ubuntu-24.04-arm, os: linux, arch: arm64 }
          - { runner: macos-14, os: darwin, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: LLVM, lld and patchelf (Linux)
        if: matrix.os == 'linux'
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 22
          sudo apt-get install -y --no-install-recommends llvm-22-dev lld-22 clang patchelf
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"

      - name: LLVM and lld (macOS)
        if: matrix.os == 'darwin'
        run: |
          brew install llvm lld
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"

      - name: Stage 0, the previous release
        id: previous
        run: |
          if ORE_HOME="$RUNNER_TEMP/previous" sh install.sh; then
            echo "ore=$RUNNER_TEMP/previous/bin/ore" >> "$GITHUB_OUTPUT"
          fi

      - name: Bun, to build the seed (first release only)
        if: steps.previous.outputs.ore == ''
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Bootstrap
        env:
          ORE: ${{ steps.previous.outputs.ore }}
        run: ci/bootstrap.sh dist

      - name: The version is the tag's
        run: test "v$(dist/ore version)" = "$GITHUB_REF_NAME"

      - name: Tests
        run: ORE=dist/ore ci/test.sh

      - name: Pack
        run: ci/package.sh "$GITHUB_REF_NAME" dist/ore out

      - uses: actions/upload-artifact@v4
        with:
          name: ore-${{ matrix.os }}-${{ matrix.arch }}
          path: out/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        working-directory: out
        run: sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/*.tar.gz out/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes "Install: \`curl -fsSL https://raw.githubusercontent.com/orelang/ore/main/install.sh | sh\`, or \`brew install orelang/tap/ore\`; update with \`ore update\`."
      - uses: actions/upload-artifact@v4
        with:
          name: sums
          path: out/SHA256SUMS

  homebrew:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sums
      - name: The formula, in orelang/homebrew-tap
        env:
          TAP_KEY: ${{ secrets.HOMEBREW_TAP_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_KEY" > ~/.ssh/tap
          chmod 600 ~/.ssh/tap
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap -o StrictHostKeyChecking=accept-new"
          git clone -q git@github.com:orelang/homebrew-tap.git tap
          mkdir -p tap/Formula
          ci/formula.sh "$GITHUB_REF_NAME" SHA256SUMS > tap/Formula/ore.rb
          cd tap
          git config user.name "ore release"
          git config user.email "release@orelang.invalid"
          git add Formula/ore.rb
          git commit -qm "ore ${GITHUB_REF_NAME#v}"
          git push -q origin HEAD
