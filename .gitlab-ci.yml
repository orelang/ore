# Tests on Linux. ci/test-linux.sh runs the same in Docker locally.

default:
  image: oven/bun:1.3.14-debian
  before_script:
    # clang for the TypeScript compiler and C sources; LLVM's library and lld
    # for the compiler in Ore (LLVM 19 or newer; 22 is Debian 13's newest).
    - apt-get -o Acquire::Retries=5 update && apt-get -o Acquire::Retries=5 install -y --no-install-recommends clang llvm-22-dev lld-22 git ca-certificates
    - export PATH=/usr/lib/llvm-22/bin:$PATH
    - bun install --frozen-lockfile --ignore-scripts

test:
  script:
    - bun run typecheck
    - bun run test
    # The concurrent programs, many times on several threads.
    - ci/stress.sh 5

# The compiler in Ore builds itself until it reproduces itself: the LLVM IR of
# stages 2 and 3 must be identical.
bootstrap:
  script:
    - ci/bootstrap.sh dist
  artifacts:
    paths:
      - dist/ore
    expire_in: 1 week

