# Tests on Linux. ci/test-linux.sh runs the same in Docker locally.

variables:
  GIT_SUBMODULE_STRATEGY: recursive

test:
  image: oven/bun:1.3.14-debian
  before_script:
    - apt-get -o Acquire::Retries=5 update && apt-get -o Acquire::Retries=5 install -y --no-install-recommends clang git ca-certificates
    - bun install --frozen-lockfile --ignore-scripts
  script:
    - bun run typecheck
    - bun test --timeout 120000
    # The concurrent programs, many times on several threads.
    - ci/stress.sh 5
