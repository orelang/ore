# Tests on Linux. ci/test-linux.sh runs the same in Docker locally.

default:
  image: oven/bun:1.3.14-debian
  before_script:
    # clang for the TypeScript compiler and C sources; LLVM's library and lld
    # for the compiler in Ore (LLVM 19 or newer; 22 is Debian 13's newest).
    - apt-get -o Acquire::Retries=5 update && apt-get -o Acquire::Retries=5 install -y --no-install-recommends clang llvm-22-dev lld-22 git ca-certificates
    - export PATH=/usr/lib/llvm-22/bin:$PATH
    - bun install --frozen-lockfile --ignore-scripts

test:
  rules:
    - if: $CI_COMMIT_TAG == null
  script:
    - bun run typecheck
    - bun run test
    # The concurrent programs, many times on several threads.
    - ci/stress.sh 5

# The compiler in Ore builds itself until it reproduces itself: the LLVM IR of
# stages 2 and 3 must be identical.
bootstrap:
  rules:
    - if: $CI_COMMIT_TAG == null
  script:
    - ci/bootstrap.sh dist
  artifacts:
    paths:
      - dist/ore
    expire_in: 1 week

# On a tag vX.Y.Z: the files of the GitHub Release (built and published by
# .github/workflows/release.yml), checked against their SHA256SUMS and copied
# to this project's package registry, with a GitLab Release linking them.
release:
  image: alpine:3.20
  before_script: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  timeout: 2h
  script:
    - apk add --no-cache curl jq coreutils
    - |
      set -e
      api="https://api.github.com/repos/orelang/ore/releases/tags/$CI_COMMIT_TAG"
      # The GitHub workflow builds three platforms first: wait for its release.
      for attempt in $(seq 1 180); do
        if curl -fsSL "$api" -o release.json && [ "$(jq '[.assets[].name] | length' release.json)" -ge 4 ]; then break; fi
        sleep 30
      done
      jq -r '.assets[] | .browser_download_url' release.json | while read -r url; do curl -fsSL -O "$url"; done
      sha256sum -c SHA256SUMS
      registry="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/ore/$CI_COMMIT_TAG"
      links='[]'
      for file in $(jq -r '.assets[].name' release.json); do
        curl -fsS --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$file" "$registry/$file"
        links=$(echo "$links" | jq --arg name "$file" --arg url "$registry/$file" '. + [{name: $name, url: $url, link_type: "package"}]')
      done
      jq -n --arg tag "$CI_COMMIT_TAG" --argjson links "$links" \
        '{tag_name: $tag, name: $tag, description: "ore \($tag). Needs LLVM'"'"'s library and lld.", assets: {links: $links}}' > body.json
      curl -fsS --header "JOB-TOKEN: $CI_JOB_TOKEN" --header "Content-Type: application/json" \
        --data @body.json "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"
