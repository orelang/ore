# Tests on Linux. ci/test-linux.sh runs the same in Docker locally.

default:
  image: debian:13
  before_script:
    # LLVM's library and lld for the compiler in Ore (LLVM 19 or newer; 22 is
    # Debian 13's newest), clang for C sources of packages, and Bun, with which
    # ci/bootstrap.sh builds its seed until a release of ore exists.
    - apt-get -o Acquire::Retries=5 update && apt-get -o Acquire::Retries=5 install -y --no-install-recommends clang llvm-22-dev lld-22 git ca-certificates curl unzip
    - curl -fsSL https://bun.sh/install | BUN_INSTALL=/usr/local bash -s bun-v1.3.14 >/dev/null
    - export PATH=/usr/lib/llvm-22/bin:$PATH

# The compiler in Ore builds itself until it reproduces itself (stages 2 and 3
# emit the same LLVM IR), then runs the test suite and the concurrent programs.
test:
  rules:
    - if: $CI_COMMIT_TAG == null && $RELEASE_TAG == null
  script:
    - ci/bootstrap.sh dist
    - ORE=dist/ore ci/test.sh
    - ORE=dist/ore ci/stress.sh 5
  artifacts:
    paths:
      - dist/ore
    expire_in: 1 week
# On a tag vX.Y.Z: the files of the GitHub Release (built and published by
# .github/workflows/release.yml), checked against their SHA256SUMS and copied
# to this project's package registry, with a GitLab Release linking them.
release:
  image: debian:13
  before_script: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    # By hand, for a release whose tag pipeline could not publish: a pipeline
    # of main with RELEASE_TAG=vX.Y.Z.
    - if: $RELEASE_TAG =~ /^v/
  timeout: 2h
  script:
    - apt-get -o Acquire::Retries=5 update && apt-get -o Acquire::Retries=5 install -y --no-install-recommends curl jq ca-certificates
    - |
      set -e
      CI_COMMIT_TAG=${CI_COMMIT_TAG:-$RELEASE_TAG}
      api="https://api.github.com/repos/orelang/ore/releases/tags/$CI_COMMIT_TAG"
      # The GitHub workflow builds three platforms first: wait for its release,
      # until it has SHA256SUMS and every file listed there (the archives and
      # the editor extensions).
      for attempt in $(seq 1 180); do
        if curl -fsSL "$api" -o release.json \
          && sums=$(jq -r '.assets[] | select(.name == "SHA256SUMS") | .browser_download_url' release.json) \
          && [ -n "$sums" ] && curl -fsSL "$sums" -o SHA256SUMS \
          && [ "$(jq --rawfile sums SHA256SUMS '($sums | split("\n") | map(select(length > 0) | split("  ")[1])) - [.assets[].name] | length' release.json)" = 0 ]; then break; fi
        sleep 30
      done
      jq -r '.assets[] | .browser_download_url' release.json | while read -r url; do curl -fsSL -O "$url"; done
      sha256sum -c SHA256SUMS
      registry="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/ore/$CI_COMMIT_TAG"
      links='[]'
      for file in $(jq -r '.assets[].name' release.json); do
        curl -fsS --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$file" "$registry/$file"
        links=$(echo "$links" | jq --arg name "$file" --arg url "$registry/$file" '. + [{name: $name, url: $url, link_type: "package"}]')
      done
      jq -n --arg tag "$CI_COMMIT_TAG" --argjson links "$links" --arg notes "$(ci/notes.sh "$CI_COMMIT_TAG")" \
        '{tag_name: $tag, name: $tag, description: $notes, assets: {links: $links}}' > body.json
      curl -fsS --header "JOB-TOKEN: $CI_JOB_TOKEN" --header "Content-Type: application/json" \
        --data @body.json "$CI_API_V4_URL/projects/$CI_PROJECT_ID/releases"
